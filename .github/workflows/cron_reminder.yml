name: Scheduled SeaTalk Reminder

on:
  # Mendengarkan trigger eksternal dari cron-job.org
  repository_dispatch:
    types: [trigger_reminder1, trigger_reminder2, trigger_reminder3, trigger_reminder4]
  
  # Tetap mempertahankan fitur tombol manual di web GitHub
  workflow_dispatch:
    inputs:
      reminder_choice:
        description: 'Pilih nomor:'
        required: true
        default: '1'
        type: choice
        options: ['1', '2', '3', '4']

jobs:
  trigger-bot:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Run Reminder Script
      env:
        SEATALK_WEBHOOK_URL: ${{ secrets.SEATALK_WEBHOOK_URL }}
      run: |
        if [ "${{ github.event_name }}" = "repository_dispatch" ]; then
          EVENT_TYPE="${{ github.event.action }}"
          # Cara yang jauh lebih aman: Menghapus teks "trigger_reminder" dan hanya menyisakan angkanya saja
          CHOICE="${EVENT_TYPE#trigger_reminder}"
        else
          CHOICE="${{ github.event.inputs.reminder_choice }}"
        fi
        
        echo "Menjalankan reminder nomor: $CHOICE"
        python send_reminder.py $CHOICE
