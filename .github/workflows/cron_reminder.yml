name: Scheduled SeaTalk Reminder

on:
  schedule:
    # Contoh trigger otomatis menggunakan UTC (02:00 UTC = 09:00 WIB)
    # Ini akan menjalankan pilihan default jika dipicu oleh jadwal otomatis
    - cron: '0 2 * * 1-5'
  
  # Fitur untuk menjalankan manual dengan pilihan masing-masing reminder
  workflow_dispatch:
    inputs:
      reminder_choice:
        description: 'Pilih nomor reminder yang ingin dikirim:'
        required: true
        default: '1'
        type: choice
        options:
          - '1'
          - '2'
          - '3'
          - '4'

jobs:
  trigger-bot:
    runs-on: ubuntu-latest

    steps:
    # 1. Menarik code dari repository GitHub Anda
    - name: Checkout Code
      uses: actions/checkout@v4

    # 2. Setup environment Python 
    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    # 3. Menjalankan script Python berdasarkan input manual atau jadwal otomatis
    - name: Run Reminder Script
      env:
        SEATALK_WEBHOOK_URL: ${{ secrets.SEATALK_WEBHOOK_URL }}
      run: |
        # Jika dijalankan manual, gunakan input pilihan. Jika otomatis, default ke '1'.
        CHOICE="${{ github.event.inputs.reminder_choice }}"
        if [ -z "$CHOICE" ]; then
          CHOICE="1"
        fi
        python send_reminder.py $CHOICE
